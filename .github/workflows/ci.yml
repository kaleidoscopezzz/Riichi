name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: riichi
          POSTGRES_PASSWORD: riichi-ci-only
          POSTGRES_DB: riichi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U riichi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      RIICHI_LOAD_DOTENV: "False"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Configure throwaway CI settings
        run: |
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"
          if [ "${{ matrix.database }}" = "postgresql" ]; then
            echo "DATABASE_URL=postgresql://riichi:riichi-ci-only@localhost:5432/riichi" >> "$GITHUB_ENV"
          else
            echo "DATABASE_URL=sqlite:///${RUNNER_TEMP}/ci.sqlite3" >> "$GITHUB_ENV"
          fi
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --noinput

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: npm audit --audit-level=high

  deploy:
    name: Deployment scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        working-directory: deploy
        run: shellcheck -x -P . lib.sh up.sh down.sh status.sh backup.sh migrate.sh restore.sh preflight.sh release.sh rollback.sh nginx/start.sh postgres/init-app.sh tests/run_ci.sh
      - name: Validate Compose file
        env:
          POSTGRES_DB: riichi
          POSTGRES_ADMIN_PASSWORD: ci-validate-only
          POSTGRES_USER: riichi_app
          POSTGRES_PASSWORD: ci-validate-only
          SECRET_KEY: ci-validate-only
          SERVER_NAME: riichi.example
          CSRF_TRUSTED_ORIGINS: https://riichi.example
        run: docker compose -f deploy/compose.yaml config --quiet

  runtime:
    name: Docker runtime and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: bash deploy/tests/run_ci.sh
      - name: Save sanitized QA summaries and screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: production-launch-qa
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .verification/docker-qa-*/http-summary.json
            .verification/docker-qa-*/operations-summary.json
            .verification/docker-qa-*/migration-summary.json
            .verification/docker-qa-*/container-status.txt
            .verification/production-launch/browser/**/*.png

  launcher:
    name: Windows launcher (static)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse with Windows PowerShell 5.1 and check encoding
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path scripts -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; foreach ($e in $errors) { Write-Host "$($file.Name): $($e.Message)" } }
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) { $failed = $true; Write-Host "$($file.Name): missing UTF-8 BOM" }
          }
          Add-Type -Path (Join-Path $PWD 'scripts\LauncherProcess.cs')
          if ($failed) { exit 1 }
