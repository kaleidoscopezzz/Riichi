# This file is envsubst'ed with ONLY SERVER_NAME and HSTS_SECONDS.
server { listen 8080 default_server; server_name _; return 444; }
server {
    listen 8080;
    server_name ${SERVER_NAME};
    return 308 https://${SERVER_NAME}$request_uri;
}
server {
    listen 8443 ssl default_server;
    server_name ${SERVER_NAME};
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    ssl_session_tickets off;
    root /usr/share/nginx/html;
    index index.html;
    add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    set $api http://api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-SSL "";
    proxy_set_header X-Forwarded-Protocol "";
    proxy_hide_header Strict-Transport-Security;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_intercept_errors off;

    location = /api/v1/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;
        proxy_pass $api;
    }
    location @login_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        return 429 '{"error":{"code":"login_rate_limited","message":"登录尝试过于频繁，请稍后重试。","fields":{}}}';
    }
    location ^~ /api/ { proxy_pass $api; }
    location = /index.html { expires -1; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
