# Substituted only with SERVER_NAME and CADDY_PROXY_IP. The original TCP peer
# must be the exact configured Caddy address, never an entire private network.
set_real_ip_from ${CADDY_PROXY_IP};
real_ip_header X-Forwarded-For;
real_ip_recursive off;
map $realip_remote_addr $from_caddy {
    default 0;
    ${CADDY_PROXY_IP} 1;
}
map "$from_caddy:$http_x_forwarded_proto" $trusted_proto {
    default "";
    "1:https" https;
    "1:http" http;
}
server { listen 8080 default_server; server_name _; return 444; }
server {
    listen 8080;
    server_name ${SERVER_NAME};
    if ($from_caddy = 0) { return 444; }
    if ($trusted_proto = "") { return 400; }
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    set $api http://api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $trusted_proto;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-SSL "";
    proxy_set_header X-Forwarded-Protocol "";
    proxy_hide_header Strict-Transport-Security;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_intercept_errors off;

    location = /api/v1/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;
        proxy_pass $api;
    }
    location @login_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        return 429 '{"error":{"code":"login_rate_limited","message":"登录尝试过于频繁，请稍后重试。","fields":{}}}';
    }
    location ^~ /api/ { proxy_pass $api; }
    location = /index.html { expires -1; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
