worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format riichi '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout riichi;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
    server { listen 8081; server_name localhost; access_log off;
        location = /healthz { return 200 'ok'; }
        location / { return 404; }
    }
    include /tmp/riichi.conf;
}
