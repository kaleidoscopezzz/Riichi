name: ${COMPOSE_PROJECT_NAME:-riichi}
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-riichi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set separate bootstrap password}
      RIICHI_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      RIICHI_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, "max_connections=${DB_MAX_CONNECTIONS:-40}", -c, "shared_buffers=${DB_SHARED_BUFFERS:-256MB}"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-app.sh:/docker-entrypoint-initdb.d/10-riichi.sh:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    cpus: ${DB_CPUS:-1.0}
    logging: *logging
  api:
    image: riichi-api:${RIICHI_VERSION:-local}
    build: {context: .., dockerfile: deploy/Dockerfile.backend}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      RIICHI_LOAD_DOTENV: "False"
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Generate SECRET_KEY on server}
      ALLOWED_HOSTS: ${SERVER_NAME:?Set a real SERVER_NAME}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set HTTPS origin}
      CORS_ALLOWED_ORIGINS: ""
      TRUST_PROXY_HEADERS: "True"
      HSTS_SECONDS: ${HSTS_SECONDS:-0}
      SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE:-28800}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    depends_on: {db: {condition: service_healthy}}
    networks: [web, data]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 40s
    mem_limit: ${API_MEMORY_LIMIT:-768m}
    cpus: ${API_CPUS:-1.0}
    logging: *logging
  nginx:
    image: riichi-nginx:${RIICHI_VERSION:-local}
    build: {context: .., dockerfile: deploy/Dockerfile.frontend}
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set a real SERVER_NAME}
      CADDY_PROXY_IP: ${CADDY_PROXY_IP:-172.30.80.2}
    depends_on: {api: {condition: service_healthy}}
    networks: [proxy, web]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: ${NGINX_MEMORY_LIMIT:-128m}
    cpus: ${NGINX_CPUS:-0.5}
    logging: *logging
  caddy:
    # Official multi-architecture manifest verified against Docker Hub.
    image: caddy:2.11.9-alpine@sha256:71d41fe4b1ae92a058abc87afe614178b996d8a6b96d0f4c71ae30606e5927e3
    command: [caddy, run, --config, "/etc/caddy/${CADDY_CONFIG:-Caddyfile}", --adapter, caddyfile]
    environment:
      CADDY_CONFIG: ${CADDY_CONFIG:-Caddyfile}
      SERVER_NAME: ${SERVER_NAME:?Set a real SERVER_NAME}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      HSTS_SECONDS: ${HSTS_SECONDS:-0}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "${PUBLIC_BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PUBLIC_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: {nginx: {condition: service_healthy}}
    networks:
      edge: {}
      proxy:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.80.2}
    # The official image seeds writable sticky /data/caddy and /config/caddy
    # directories. Named volumes preserve those permissions and ACME state.
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    sysctls: {net.ipv4.ip_unprivileged_port_start: "0"}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://127.0.0.1:2019/config/]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    restart: unless-stopped
    mem_limit: ${CADDY_MEMORY_LIMIT:-256m}
    cpus: ${CADDY_CPUS:-0.5}
    logging: *logging
networks:
  edge: {}
  proxy:
    internal: true
    ipam:
      config: [{subnet: "${PROXY_SUBNET:-172.30.80.0/28}"}]
  web: {internal: true}
  data: {internal: true}
volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
