name: ${COMPOSE_PROJECT_NAME:-riichi}
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-riichi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set separate bootstrap password}
      RIICHI_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      RIICHI_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, "max_connections=${DB_MAX_CONNECTIONS:-40}", -c, "shared_buffers=${DB_SHARED_BUFFERS:-256MB}"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-app.sh:/docker-entrypoint-initdb.d/10-riichi.sh:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    cpus: ${DB_CPUS:-1.0}
    logging: *logging
  api:
    image: riichi-api:${RIICHI_VERSION:-local}
    build: {context: .., dockerfile: deploy/Dockerfile.backend}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Generate SECRET_KEY on server}
      ALLOWED_HOSTS: ${SERVER_NAME:?Set a real SERVER_NAME}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set HTTPS origin}
      CORS_ALLOWED_ORIGINS: ""
      TRUST_PROXY_HEADERS: "True"
      HSTS_SECONDS: ${HSTS_SECONDS:-0}
      SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE:-28800}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    depends_on: {db: {condition: service_healthy}}
    networks: [web, data]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 40s
    mem_limit: ${API_MEMORY_LIMIT:-768m}
    cpus: ${API_CPUS:-1.0}
    logging: *logging
  nginx:
    image: riichi-nginx:${RIICHI_VERSION:-local}
    build: {context: .., dockerfile: deploy/Dockerfile.frontend}
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set a real SERVER_NAME}
      HSTS_SECONDS: ${HSTS_SECONDS:-0}
      # Same value as the published HTTPS port below; used for HTTP->HTTPS redirects.
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${PUBLIC_BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${PUBLIC_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    volumes:
      - type: bind
        source: ${TLS_CERT_DIR:?Set absolute TLS_CERT_DIR}
        target: /etc/nginx/tls
        read_only: true
        bind: {create_host_path: false}
    depends_on: {api: {condition: service_healthy}}
    networks: [edge, web]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: ${NGINX_MEMORY_LIMIT:-128m}
    cpus: ${NGINX_CPUS:-0.5}
    logging: *logging
networks:
  edge: {}
  web: {internal: true}
  data: {internal: true}
volumes:
  postgres_data: {}
