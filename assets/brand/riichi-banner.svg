  <text x="68" y="230" fill="#e5e8ed" font-family="sans-serif" font-size="29" letter-spacing="3">从容开赛，专注每场对局。</text>
  <text x="69" y="273" fill="#99a3b2" font-family="sans-serif" font-size="16" letter-spacing="2">四人立直麻将 · 雀庄个人赛事管理</text>
