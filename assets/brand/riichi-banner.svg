<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Riichi — 从容开赛，专注每场对局</title>
  <desc id="desc">深海军蓝与金色的原创 Riichi 标识，配以东南西北四张风牌。面向雀庄的个人赛事管理系统。</desc>
  <rect width="1280" height="340" rx="20" fill="#10151e"/>
